[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dataguard-ai"
version = "0.2.1"
description = "Open-source data quality and governance copilot: scan data, detect risks, explain findings, and generate fixes."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Aditya Ranjan"}]
keywords = ["data-quality", "data-governance", "data-contracts", "pii", "dbt", "great-expectations", "duckdb", "postgresql", "ai"]
dependencies = ["pandas>=2.0","typer>=0.12","rich>=13.7","pydantic>=2.7","PyYAML>=6.0"]

[project.optional-dependencies]
parquet = ["pyarrow>=15"]
duckdb = ["duckdb>=1.0"]
postgres = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1"]
gx = ["great_expectations>=1.0"]
ai = ["openai>=1.40"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
all = ["pyarrow>=15","duckdb>=1.0","sqlalchemy>=2.0","psycopg[binary]>=3.1","great_expectations>=1.0","openai>=1.40"]

[project.scripts]
dataguard = "dataguard.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
